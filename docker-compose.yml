# The app behind Caddy, which gets and renews the HTTPS certificate itself.
# Set DOMAIN in .env next to this file (e.g. DOMAIN=assistant.unctech.co) and
# point that domain's DNS A record at the server first.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - sarah-data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
volumes:
  sarah-data:
  caddy-data:
